version: '3.8'

# Step 4 of Practical 11: Orchestrate Frontend, Backend, and MongoDB
services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: task_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      # Supplementary Problem 3: Named volume for persistent database storage
      - mongo_data:/data/db
    networks:
      - app-network

  # 2. Node/Express Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: task_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      # Step 5: Reference MongoDB container by service name 'mongodb'
      - MONGO_URI=mongodb://mongodb:27017/task-manager
      - JWT_SECRET=supersecretkey_student_lab_2026
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. React Vite Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: task_frontend
    restart: always
    ports:
      - '5173:5173'
    depends_on:
      - backend
    networks:
      - app-network

# Step 4: Bridge network for inter-container communication
networks:
  app-network:
    driver: bridge

# Supplementary Problem 3: Named volume for data persistence across container restarts
volumes:
  mongo_data:
    driver: local
